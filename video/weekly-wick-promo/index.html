<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Weekly Wick 홍보 영상</title>
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url(fonts/Pretendard-Medium.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url(fonts/Pretendard-SemiBold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url(fonts/Pretendard-Bold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 900; src: url(fonts/Pretendard-Black.otf); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(fonts/Inter-ExtraBold.otf); }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url(fonts/Inter-Black.otf); }
  html, body { margin: 0; padding: 0; background: #10141f; overflow: hidden; }
  #stage { display: block; width: 1080px; height: 1920px; }
  /* Preload every weight so the first seek never renders a fallback face. */
  #preload { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<div id="preload">
  <span style="font:500 10px Pretendard">가</span><span style="font:600 10px Pretendard">가</span>
  <span style="font:700 10px Pretendard">가</span><span style="font:800 10px Pretendard">가</span>
  <span style="font:900 10px Pretendard">가</span><span style="font:800 10px Inter">A</span>
  <span style="font:900 10px Inter">A</span>
</div>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"></svg>
<script type="module">
import { drawWick, blinkAt } from './lib/rig.mjs';

// Weekly Wick promo, 9:16, 30 s. Every frame is a pure function of t (seconds).
const W = 1080, H = 1920;
window.DURATION = 30;

const C = {
  bg: '#0f1320', bg2: '#1a2440', text: '#eef1f7', soft: '#c9d0de', muted: '#8d96a8',
  paper: '#f3ede1', rule: '#dccfb6', margin: '#e07b68', ink: '#1b1f2a', inkSoft: '#3f3a33', inkMuted: '#6b6457',
  green: '#22c47a', red: '#ef5350', gray: '#8a8174', amber: '#ffb020', label: '#ffc23d',
};

// Scene table (seconds) and the transition into each scene (type, seconds of overlap before the cut).
const S = {
  hook: [0, 5.5],
  brand: [5.5, 8.5],
  rule: [8.5, 14.0],
  week: [14.0, 18.0],
  graded: [18.0, 24.0],
  cta: [24.0, 30],
};
// cut: hard match cut on the beat (the lit wick becomes Wick). push: old scene leaves upward as the new one arrives, never overlapping.
const IN = { brand: ['cut', 0], rule: ['push', 0.4], week: ['push', 0.4], graded: ['push', 0.4], cta: ['expand', 0.5] };
window.SCENES = S;

// Sound cues in scene-local seconds, read by scripts/soundtrack.mjs.
const CUE_TABLE = {
  hook: [[0.5, 'pop'], [2.0, 'whoosh'], [2.5, 'stamp'], [3.0, 'pop'], [3.5, 'pop'], [4.0, 'pop'], [4.5, 'pop']],
  brand: [[0, 'stamp'], [0.25, 'stamp'], [1.0, 'stamp'], [1.5, 'stamp']],
  rule: [[-0.4, 'whoosh'], [1.0, 'stamp'], [2.5, 'stamp'], [2.8, 'pop'], [4.0, 'pop']],
  week: [[-0.4, 'whoosh'], [0.5, 'pop'], [0.75, 'pop'], [1.0, 'pop'], [1.25, 'pop'], [1.5, 'pop'], [1.75, 'stamp'], [2.05, 'pop']],
  graded: [[-0.4, 'whoosh'], [0.0, 'stamp'], [0.5, 'stamp'], [1.7, 'pop']],
  cta: [[-0.5, 'whoosh'], [0.5, 'stamp'], [0.75, 'stamp'], [0.6, 'pop'], [1.5, 'pop'], [2.5, 'pop'], [3.5, 'pop'], [4.5, 'stamp'], [4.75, 'stamp'], [5.0, 'pop']],
};
window.CUES = Object.entries(CUE_TABLE).flatMap(([k, list]) => list.map(([d, kind]) => ({ at: +(S[k][0] + d).toFixed(3), kind })));

// ---------- motion ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => { k = clamp(k); return k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2; };
const easeOut = (k) => 1 - (1 - clamp(k)) ** 3;
const easeIn = (k) => clamp(k) ** 3;

// Damped mass-spring from 0 to 1, closed form. mass > 1 feels heavier and overshoots longer.
function spring(t, { mass = 1, stiffness = 180, damping = 14 } = {}) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (z >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
}
const SP = {
  pop: { mass: 1, stiffness: 260, damping: 15 },      // text and chips
  soft: { mass: 1.4, stiffness: 150, damping: 21 },   // panels and paper
  heavy: { mass: 2.2, stiffness: 420, damping: 30 },  // stamps landing
  bouncy: { mass: 1.2, stiffness: 200, damping: 11 }, // character entrances
};

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// Decaying shake after an impact at local time 0.
function shake(t, dur = 0.32, amp = 10) {
  if (t < 0 || t > dur) return { x: 0, y: 0 };
  const k = (1 - t / dur) ** 2 * amp;
  return { x: Math.sin(t * 93) * k, y: Math.cos(t * 71) * k };
}

// ---------- drawing helpers ----------
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const f1 = (v) => (Math.round(v * 10) / 10).toString();

function text(str, x, y, { size = 64, weight = 800, fill = C.text, anchor = 'middle', family = 'Pretendard', ls = -0.02, opacity = 1 } = {}) {
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${family}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${f1(size * ls)}" opacity="${opacity.toFixed(3)}">${esc(str)}</text>`;
}

// A line that springs up into place. Before `start` it is not drawn; a start at or below the
// scene's entry time means the line is simply already there when the scene arrives.
function popLine(lt, start, str, x, y, opts = {}) {
  if (lt < start) return '';
  const k = spring(lt - start, opts.spring || SP.pop);
  const s = lerp(0.72, 1, k), dy = (1 - k) * 46, op = clamp((lt - start) / 0.12);
  return `<g transform="translate(${f1(x)},${f1(y + dy)}) scale(${s.toFixed(4)})">${text(str, 0, 0, { ...opts, opacity: op })}</g>`;
}

// Worn rubber stamp, same construction as the card renderer (lib/cards.mjs, style B),
// plus a displacement filter so the ink edge is irregular like a real stamp.
function stamp(label, color, size, seed) {
  const w = label.length * size * 0.66 + size * 1.4, h = size * 1.9;
  const r = rng(seed);
  let specks = '';
  for (let i = 0; i < 110; i++) specks += `<circle cx="${f1((r() - 0.5) * w)}" cy="${f1((r() - 0.5) * h)}" r="${f1(0.8 + r() * size * 0.06)}" fill="#000"/>`;
  const id = `wear${seed}`;
  return `<mask id="${id}"><rect x="${-w}" y="${-h}" width="${w * 2}" height="${h * 2}" fill="#fff"/>${specks}</mask>
    <g mask="url(#${id})" filter="url(#inkRough)" fill-opacity="0.9" stroke-opacity="0.9">
      <rect x="${f1(-w / 2)}" y="${f1(-h / 2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(size * 0.25)}" fill="none" stroke="${color}" stroke-width="${f1(size * 0.13)}"/>
      <rect x="${f1(-w / 2 + size * 0.22)}" y="${f1(-h / 2 + size * 0.22)}" width="${f1(w - size * 0.44)}" height="${f1(h - size * 0.44)}" rx="${f1(size * 0.15)}" fill="none" stroke="${color}" stroke-width="${f1(size * 0.055)}"/>
      <text x="0" y="${f1(size * 0.36)}" font-family="Inter" font-size="${size}" font-weight="900" text-anchor="middle" letter-spacing="${f1(size * 0.04)}" fill="${color}">${esc(label)}</text>
    </g>`;
}

// Stamp that drops from above the paper and lands with a heavy spring.
function stampAt(lt, start, label, color, x, y, size, rot, seed) {
  if (lt < start) return '';
  const k = spring(lt - start, SP.heavy);
  const s = lerp(1.5, 1, k), op = clamp((lt - start) / 0.03);
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${rot}) scale(${s.toFixed(4)})" opacity="${op.toFixed(3)}">${stamp(label, color, size, seed)}</g>`;
}

// The character from the real rig, feet at (x, y).
function wick(t, x, y, scale, state) {
  const g = drawWick({ t, blink: blinkAt(t), up: true, ...state });
  return `<g transform="translate(${f1(x - 300 * scale)},${f1(y - 712 * scale)}) scale(${scale.toFixed(4)})">${g}</g>`;
}

// Same teardrop flame as the rig, for lighting the chart candle's wick.
const TEARDROP = 'M0,-1 C0.22,-0.72 0.38,-0.5 0.36,-0.28 C0.34,-0.08 0.18,0 0,0 C-0.18,0 -0.34,-0.08 -0.36,-0.28 C-0.38,-0.5 -0.22,-0.72 0,-1 Z';
function flame(t, x, y, s) {
  if (s <= 0.001) return '';
  const sx = 1 + 0.05 * Math.sin(t * 9.1) + 0.03 * Math.sin(t * 15.7), sy = 1 + 0.07 * Math.sin(t * 7.3 + 1);
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(4 * Math.sin(t * 4.2))}) scale(${(sx * s).toFixed(3)},${(sy * s).toFixed(3)})">
    <path d="${TEARDROP}" fill="#ff6a1a" transform="scale(150)"/>
    <path d="${TEARDROP}" fill="#ffae1f" transform="translate(0,-6) scale(102)"/>
    <path d="${TEARDROP}" fill="#fff2a8" transform="translate(0,-7.5) scale(51)"/></g>`;
}

function candle(cx, open, close, high, low, w, color, gloss = false) {
  const top = Math.min(open, close), bot = Math.max(open, close);
  const gl = gloss && bot - top > 60 ? `<rect x="${f1(cx - w / 2 + w * 0.12)}" y="${f1(top + 22)}" width="${f1(w * 0.13)}" height="${f1(Math.min(bot - top - 44, (bot - top) * 0.6))}" rx="${f1(w * 0.065)}" fill="#fff" fill-opacity="0.3"/>` : '';
  const shade = gloss && bot - top > 60 ? `<rect x="${f1(cx + w / 2 - w * 0.2)}" y="${f1(top)}" width="${f1(w * 0.2)}" height="${f1(bot - top)}" rx="${f1(w * 0.08)}" fill="#000" fill-opacity="0.12"/>` : '';
  return `<line x1="${f1(cx)}" y1="${f1(high)}" x2="${f1(cx)}" y2="${f1(low)}" stroke="${color}" stroke-width="${f1(Math.max(4, w * 0.11))}" stroke-linecap="round"/>
    <rect x="${f1(cx - w / 2)}" y="${f1(top)}" width="${f1(w)}" height="${f1(Math.max(6, bot - top))}" rx="${f1(w * 0.08)}" fill="${color}"/>${gl}${shade}`;
}

// LIVE / CONFIRMED pill, as on the brand cards and the weekly video.
function pill(x, y, label, bg, { size = 34, dot = false } = {}) {
  const padX = size * 0.75, h = size * 1.75;
  const w = label.length * size * 0.56 + padX * 2 + (dot ? size * 0.9 : 0);
  return `<g><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(h / 2)}" fill="${bg}"/>
    ${dot ? `<circle cx="${f1(x + padX + size * 0.3)}" cy="${f1(y + h / 2)}" r="${f1(size * 0.28)}" fill="#e5383b"/>` : ''}
    ${text(label, x + padX + (dot ? size * 0.9 : 0), y + h / 2 + size * 0.36, { size, weight: 800, family: 'Inter', fill: C.ink, anchor: 'start', ls: 0 })}</g>`;
}

const DEFS = `<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="${C.bg}"/><stop offset="0.5" stop-color="${C.bg2}"/><stop offset="1" stop-color="${C.bg}"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
  <filter id="inkRough" x="-10%" y="-20%" width="120%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="4"/>
  </filter>
  <radialGradient id="paperVig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#7a5c2e" stop-opacity="0"/><stop offset="1" stop-color="#7a5c2e" stop-opacity="0.16"/></radialGradient>
  <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>`;

function background() {
  return `<rect width="${W}" height="${H}" fill="url(#bgG)"/><rect width="${W}" height="${H}" fill="url(#vig)"/>`;
}

// Judges' sheet: cream ruled paper, red margin, ink header band (brand card style B).
// Full-bleed by default: the critics read a navy border around the card as a letterbox.
function paper(x, y, w, h, { band = 170, rx = 0, shadow = false } = {}) {
  const id = `pc${Math.round(x)}_${Math.round(y)}_${Math.round(w)}_${Math.round(band)}`;
  let rules = '';
  for (let ry = y + band + 70; ry < y + h - 10; ry += 64) rules += `<line x1="${f1(x)}" y1="${f1(ry)}" x2="${f1(x + w)}" y2="${f1(ry)}" stroke="${C.rule}" stroke-width="2.5"/>`;
  return `<clipPath id="${id}"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}"/></clipPath>
    <rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" fill="${C.paper}" ${shadow ? 'filter="url(#paperShadow)"' : ''}/>
    <g clip-path="url(#${id})">${rules}
    <rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="url(#paperVig)"/>
    <line x1="${f1(x + 64)}" y1="${f1(y)}" x2="${f1(x + 64)}" y2="${f1(y + h)}" stroke="${C.margin}" stroke-width="4"/>
    ${band > 0.5 ? `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(band)}" fill="${C.ink}"/>
      ${text('WEEKLY WICK', x + w - 64, y + band - 50, { size: 40, weight: 900, family: 'Inter', fill: C.paper, anchor: 'end', ls: 0.18 })}` : ''}
    </g>`;
}
const L = 120; // left text edge on paper scenes

// ---------- scenes (lt = seconds since the scene's cut; negative while it transitions in) ----------

// 1. Hook. Frame 0 is the thumbnail: headline, LIVE pill, wordmark, a tall candle mid-rise and a big Wick
//    watching it. The weekly candle climbs Mon..Wed, the Friday close gives it all back, and the
//    leftover upper wick is where the name comes from. Then that wick catches fire.
const HOOK = { open: 1500, cx: 560, cw: 210 };
function hookCandle(lt) {
  // Monday is already done at frame 0; each later day moves the close with its own spring.
  const steps = [[0.5, -190], [2.0, 330], [2.5, 610]];
  let close = HOOK.open - 680, high = HOOK.open - 700;
  steps.forEach(([st, d]) => {
    const k = spring(lt - st, { mass: 1.2, stiffness: 160, damping: 15 });
    close += d * k;
    if (d < 0) high += d * Math.min(1, k);
  });
  return { close, high };
}
function sceneHook(lt) {
  const { open, cx, cw } = HOOK;
  const days = ['월', '화', '수', '목', '금'], dayT = [-3, -2, -1, 2.0, 2.5];
  let day = 0;
  dayT.forEach((d, i) => { if (lt >= d) day = i; });
  const { close, high } = hookCandle(lt);
  const isRed = close > open;

  // A few past weeks to the right of the hero candle.
  const hist = [[800, 1520, 1430, 1390, 1560], [885, 1440, 1490, 1405, 1520], [970, 1490, 1420, 1380, 1515]];
  let bgC = '';
  hist.forEach(([x, o, c, hi, lo]) => { bgC += candle(x, o, c, hi, lo, 62, c < o ? C.green : C.red); });

  const closeY = open + 130, lineK = easeOut((lt - 2.3) / 0.5);
  const closeLine = lineK > 0 ? `<line x1="${f1(540 - 500 * lineK)}" y1="${closeY}" x2="${f1(540 + 500 * lineK)}" y2="${closeY}" stroke="${C.text}" stroke-width="5" stroke-dasharray="20 14" opacity="0.75"/>
    ${text('금요일 마감', 1016, closeY + 52, { size: 42, weight: 800, fill: C.soft, anchor: 'end', opacity: lineK })}` : '';

  const bk = spring(lt - 3.0, SP.pop);
  const bracket = lt > 3.0 ? `<g opacity="${clamp((lt - 3.0) / 0.12).toFixed(3)}" transform="translate(${f1(lerp(40, 0, bk))},0)">
      <path d="M ${cx + 140} ${f1(high)} h 30 v ${f1(open - 20 - high)} h -30" fill="none" stroke="${C.label}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      ${text('이게', cx + 196, (high + open) / 2 - 18, { size: 66, weight: 900, fill: C.label, anchor: 'start' })}
      ${text('윅(Wick)', cx + 196, (high + open) / 2 + 58, { size: 66, weight: 900, fill: C.label, anchor: 'start' })}
    </g>` : '';

  let chips = '';
  days.forEach((d, i) => {
    const x = 540 + (i - 2) * 176, on = i === day, past = i < day;
    const k = on ? spring(lt - dayT[i], SP.pop) : 1;
    const s = on ? 1 + 0.14 * Math.max(0, 1 - clamp((lt - dayT[i]) / 0.5)) * k : 1;
    const fill = on ? (i === 4 ? C.red : i === 3 ? C.amber : C.green) : '#2a3350';
    chips += `<g transform="translate(${x},1782) scale(${s.toFixed(3)})">
      <rect x="-70" y="-50" width="140" height="100" rx="28" fill="${fill}" ${on ? '' : 'stroke="#3b4666" stroke-width="2"'}/>
      ${text(d, 0, 19, { size: 54, weight: 800, fill: on ? C.ink : past ? '#c3cad8' : '#9aa3b8' })}</g>`;
  });

  const shk = shake(lt - 2.55, 0.4, 14);
  const rising = lt < 1.95;
  const head = rising
    ? text('주중에 급등?', 540, 345, { size: 120, weight: 900 }) + text('아직 아무것도 아닙니다', 540, 462, { size: 64, weight: 700, fill: C.soft })
    : popLine(lt, 2.0, '금요일에 밀리면', 540, 345, { size: 120, weight: 900 }) + popLine(lt, 2.2, '꼬리만 남고 끝', 540, 462, { size: 64, weight: 800, fill: '#ff8582' });

  // Wick watches the candle: calm, excited on the rise, tense on Thursday, gloomy at the close, then lit.
  const mood = lt < 2.0 ? 'excited' : lt < 2.5 ? 'tense' : lt < 3.5 ? 'gloomy' : 'excited';
  const flameK = spring(lt - 3.5, { mass: 1, stiffness: 120, damping: 8 });
  const lean = mood === 'excited' ? 2 : mood === 'gloomy' ? -2 : 0;

  const push = 1 + 0.04 * ease(lt / 5);
  return `<g transform="translate(${f1(shk.x)},${f1(shk.y)})">
    ${pill(60, 96, 'LIVE · Friday close', C.amber, { size: 32, dot: true })}
    ${text('WEEKLY WICK', 1020, 146, { size: 36, weight: 900, family: 'Inter', anchor: 'end', ls: 0.18 })}
    ${head}
    <g transform="translate(540,1180) scale(${push.toFixed(4)}) translate(-540,-1180)">
      <g opacity="0.45">${bgC}</g>
      ${closeLine}
      ${candle(cx, open, close, high, Math.max(open, close) + 46, cw, isRed ? C.red : C.green, true)}
      ${flame(lt, cx, high - 6, 0.5 * flameK)}
      ${bracket}
      <g transform="translate(0,${f1(-60 * (Math.max(0, Math.sin(Math.PI * clamp((lt - 4.0) / 0.4))) + Math.max(0, Math.sin(Math.PI * clamp((lt - 4.5) / 0.4)))))}) rotate(${lean},235,1650)">${wick(lt, 235, 1650, 1.05, { mood, mouth: mood === 'excited' && (lt < 1.2 || lt > 3.5) ? 'wide' : 'closed', flameSize: mood === 'gloomy' ? 0.5 : 1 })}</g>
    </g>
    ${chips}
  </g>`;
}

// 2. Brand: wordmark slams, Wick stands lit, the two verdict stamps land either side.
function sceneBrand(lt) {
  const enter = spring(lt + 0.2, SP.soft);
  const sc = lerp(0.6, 1.42, enter);
  const slam = (str, st, y) => {
    if (lt < st) return '';
    const k = spring(lt - st, SP.pop);
    return `<g transform="translate(540,${f1(y)}) scale(${lerp(1.3, 1, k).toFixed(3)})">${text(str, 0, 0, { size: 168, weight: 900, family: 'Inter', ls: 0.01, opacity: clamp((lt - st) / 0.06) })}</g>`;
  };
  const shk = shake(lt, 0.3, 11), shk2 = shake(lt - 1.0, 0.25, 7), shk3 = shake(lt - 1.5, 0.25, 7);
  return `<g transform="translate(${f1(shk.x + shk2.x + shk3.x)},${f1(shk.y + shk2.y + shk3.y)})">
    ${slam('WEEKLY', -0.1, 330)}${slam('WICK', 0.25, 492)}
    ${popLine(lt, 0.4, 'Weekly close or it didn\'t happen.', 540, 600, { size: 56, weight: 800, family: 'Inter', fill: C.label, ls: -0.015 })}
    ${stampAt(lt, 1.0, 'QUALIFIED', '#3ddc92', 185, 1500, 42, -9, 61)}
    ${stampAt(lt, 1.5, 'VANISHED', '#e2dacb', 900, 1420, 42, 6, 62)}
    ${wick(lt, 540, 1600, sc, { mood: 'excited', mouth: lt < 0.9 ? 'wide' : 'closed', flameSize: 1.15 })}
    ${popLine(lt, 0.7, '미국 주식을 매주 한 번,', 540, 1712, { size: 68, weight: 800 })}
    ${popLine(lt, 0.85, '금요일 마감으로만 판정합니다', 540, 1792, { size: 54, weight: 700, fill: C.soft })}
  </g>`;
}

// Mini weekly chart for the rule sheet; k animates the last candle (0..1).
function miniChart(kind, k) {
  const bandY = 150;
  const bars = [[0, 210, 190, 170, 230], [1, 195, 215, 180, 235], [2, 215, 200, 185, 240], [3, 205, 185, 165, 225], [4, 190, 170, 150, 205]];
  let s = `<line x1="0" y1="${bandY}" x2="420" y2="${bandY}" stroke="${C.ink}" stroke-width="3" stroke-dasharray="12 10" opacity="0.5"/>`;
  bars.forEach(([i, o, c, hi, lo]) => { s += candle(30 + i * 62, o, c, hi, lo, 36, c < o ? '#3fa873' : '#d0665f'); });
  const cx = 30 + 5 * 62 + 16, o = 175;
  if (k <= 0) return s;
  if (kind === 'hold') {
    s += candle(cx, o, lerp(o - 4, 88, k), lerp(o - 4, 66, k), o + 18, 50, C.green);
  } else {
    const up = clamp(k / 0.55), dn = clamp((k - 0.55) / 0.45);
    const hi = lerp(o - 4, 50, ease(up));
    const c = lerp(lerp(o - 4, 70, ease(up)), 205, ease(dn));
    s += candle(cx, o, c, hi, Math.max(o, c) + 16, 50, c > o ? C.red : C.green);
  }
  return s;
}

// 3. The rule, on the judges' sheet: hold the close = QUALIFIED, slip = VANISHED.
//    Each case gets its own framed chart panel; stamps land on clean paper in the panel's upper left.
function chartPanel(y, kind, k) {
  const x = L, w = W - L - 120, h = 380;
  return `<rect x="${x + 6}" y="${y + 10}" width="${w}" height="${h}" rx="26" fill="${C.ink}" opacity="0.08"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="#e7dcc4" stroke="${C.ink}" stroke-opacity="0.28" stroke-width="3"/>
    <g transform="translate(${x + 40},${y - 40}) scale(1.85)">${miniChart(kind, k)}</g>`;
}
function sceneRule(lt) {
  const hitA = 1.0, hitB = 2.5;
  const kA = ease((lt + 0.2) / 0.9), kB = ease((lt - 1.3) / 1.0);
  let mood = 'calm', mouth = 'closed';
  if (lt > hitA && lt < hitB) { mood = 'excited'; mouth = lt < hitA + 0.7 ? 'wide' : 'closed'; }
  if (lt >= hitB && lt < hitB + 1.3) mood = 'gloomy';
  if (lt >= hitB + 1.3) { mood = 'excited'; mouth = 'closed'; }
  const s1 = shake(lt - hitA, 0.3, 11), s2 = shake(lt - hitB, 0.3, 11);
  const pA = 545, pB = 1060;
  return `<g transform="translate(${f1(s1.x + s2.x)},${f1(s1.y + s2.y)})">
    ${paper(0, 0, W, H)}
    ${text('판정은 두 가지뿐', L, 345, { size: 100, weight: 900, fill: C.ink, anchor: 'start' })}
    ${text('마감까지 버티면', L, pA - 34, { size: 64, weight: 800, fill: C.ink, anchor: 'start' })}
    ${chartPanel(pA, 'hold', kA)}
    ${stampAt(lt, hitA, 'QUALIFIED', C.green, L + 250, pA + 92, 54, -8, 11)}
    ${text('마감에 밀리면', L, pB - 34, { size: 64, weight: 800, fill: C.ink, anchor: 'start' })}
    ${chartPanel(pB, 'fade', kB)}
    ${stampAt(lt, hitB, 'VANISHED', C.gray, L + 230, pB + 92, 54, -6, 23)}
    ${popLine(lt, 2.8, '중간에 튄 건', L, 1600, { size: 60, weight: 900, fill: C.ink, anchor: 'start' })}
    ${popLine(lt, 2.95, '판정에 넣지 않습니다', L, 1680, { size: 60, weight: 900, fill: C.ink, anchor: 'start' })}
    <g transform="translate(0,${f1(-50 * Math.max(0, Math.sin(Math.PI * clamp((lt - 4.0) / 0.45))))})">${wick(lt, 930, 1850, 0.62, { mood, mouth, flameSize: mood === 'gloomy' ? 0.5 : 1 })}</g>
  </g>`;
}

// 4. The week's rhythm: a day cursor walks the rows on the beat and lands on Saturday's confirmed verdict.
const WEEK = { rowT: (i) => -0.3 + i * 0.08, cur0: 0.5, step: 0.25 };
function sceneWeek(lt) {
  const rows = [['월', '지난 판정 채점'], ['화', '무료 공개 종목 추적'], ['수', '신호가 사라지는 이유'], ['목', '후보 레이스와 투표'], ['금', '마감 직전 예고'], ['토', '이번 주 확정 발표']];
  const satHit = WEEK.cur0 + 5 * WEEK.step;
  const cur = lt < WEEK.cur0 ? -1 : Math.min(5, Math.floor((lt - WEEK.cur0) / WEEK.step));
  let s = '';
  rows.forEach(([d, label], i) => {
    if (lt < WEEK.rowT(i)) return;
    const k = spring(lt - WEEK.rowT(i), { mass: 1, stiffness: 300, damping: 26 }), y = 480 + i * 184, last = i === 5;
    const dx = 0, dy = (1 - k) * 60, op = clamp((lt - WEEK.rowT(i)) / 0.12);
    if (last) {
      const hk = spring(lt - satHit, SP.heavy), lit = lt >= satHit;
      const sc = lit ? lerp(1.12, 1, hk) : 1;
      s += `<g transform="translate(${f1(dx + 540)},${f1(y + dy)}) scale(${sc.toFixed(3)}) translate(-540,${-y})" opacity="${op.toFixed(3)}">
        <rect x="64" y="${y - 86}" width="952" height="172" rx="40" fill="${lit ? C.green : '#22304d'}"/>
        <rect x="100" y="${y - 58}" width="116" height="116" rx="28" fill="${lit ? C.ink : '#2a3350'}" ${lit ? '' : 'stroke="#3b4666" stroke-width="3"'}/>
        ${text(d, 158, y + 22, { size: 60, weight: 900, fill: lit ? C.green : C.text })}
        ${text(label, 252, y + 26, { size: 74, weight: 900, fill: lit ? C.ink : '#dfe4ee', anchor: 'start' })}
      </g>`;
    } else {
      const active = i === cur, done = cur > i;
      const ak = active ? spring(lt - (WEEK.cur0 + i * WEEK.step), SP.pop) : 0;
      s += `<g transform="translate(0,${f1(dy)})" opacity="${op.toFixed(3)}">
        ${active ? `<rect x="64" y="${y - 80}" width="952" height="160" rx="36" fill="#22304d" stroke="${C.green}" stroke-width="3" transform="translate(540,${y}) scale(${lerp(0.94, 1, ak).toFixed(3)},1) translate(-540,${-y})"/>` : ''}
        <rect x="100" y="${y - 58}" width="116" height="116" rx="28" fill="${done || active ? '#173a2c' : '#2a3350'}" stroke="${done || active ? C.green : '#3b4666'}" stroke-width="3"/>
        ${text(d, 158, y + 22, { size: 58, weight: 900, fill: done || active ? '#9df0c6' : '#ffffff' })}
        ${text(label, 252, y + 25, { size: 74, weight: active ? 900 : 800, fill: done ? '#c8cfdc' : '#eef1f7', anchor: 'start' })}
      </g>`;
    }
  });
  const pk = spring(lt - satHit - 0.3, SP.pop);
  const pl = lt > satHit + 0.3 ? `<g transform="translate(100,1590) scale(${lerp(0.6, 1, pk).toFixed(3)})" opacity="${clamp((lt - satHit - 0.3) / 0.1).toFixed(3)}">${pill(0, 0, 'CONFIRMED · Weekly close', C.green, { size: 42 })}</g>` : '';
  const wy = lerp(2400, 1850, spring(lt - satHit + 0.1, SP.bouncy));
  return `${text('WEEKLY WICK', 1020, 146, { size: 36, weight: 900, family: 'Inter', anchor: 'end', ls: 0.18 })}
    ${text('일주일 내내, 규칙대로', 60, 340, { size: 98, weight: 900, anchor: 'start' })}
    ${s}${pl}
    ${wick(lt, 905, wy, 0.5, { mood: lt > satHit ? 'excited' : 'calm', mouth: lt > satHit && lt < satHit + 0.6 ? 'wide' : 'closed', flameSize: 1.1 })}`;
}

// 5. Accountability: every call graded against SPY, misses included.
function sceneGradedContent(lt) {
  const hitA = 0.0, hitB = 0.5;
  let mood = 'calm';
  if (lt > hitA && lt < hitB) mood = 'excited';
  if (lt >= hitB && lt < hitB + 1.0) mood = 'tense';
  if (lt >= hitB + 1.0) mood = 'excited';
  return `${text('틀린 판정도', L, 350, { size: 104, weight: 900, fill: C.ink, anchor: 'start' })}
    ${text('전부 공개합니다', L, 474, { size: 104, weight: 900, fill: C.ink, anchor: 'start' })}
    ${text('SPY보다 잘했으면', L, 640, { size: 60, weight: 800, fill: C.inkSoft, anchor: 'start' })}
    ${stampAt(lt, hitA, 'BEAT SPY', C.green, L + 250, 770, 66, -6, 31)}
    ${text('SPY보다 못했어도', L, 960, { size: 60, weight: 800, fill: C.inkSoft, anchor: 'start' })}
    ${stampAt(lt, hitB, 'TRAILED SPY', C.red, L + 330, 1090, 66, -4, 47)}
    ${popLine(lt, 1.7, '모든 판정은', L, 1330, { size: 76, weight: 900, fill: C.ink, anchor: 'start' })}
    ${popLine(lt, 1.85, 'SPY와 비교해 채점', L, 1422, { size: 76, weight: 900, fill: C.ink, anchor: 'start' })}
    ${popLine(lt, 2.1, '매주 월요일, 결과 그대로', L, 1520, { size: 54, weight: 800, fill: C.inkSoft, anchor: 'start' })}
    ${wick(lt, 880, 1850, 0.85, { mood, flameSize: 1 })}`;
}

// 6. CTA on full-bleed judges' paper: a vertical take on the brand's X header. It keeps moving with
//    three clear beats: Wick hops (arms up), the button presses, the stamps re-ink.
const CTA_BEATS = [1.5, 2.5, 3.5, 5.0];
function sceneCtaContent(lt) {
  const sc = lerp(1.15, 1.5, spring(lt + 0.3, SP.soft));
  const beat = (t0, d = 0.45) => Math.max(0, Math.sin(Math.PI * clamp((lt - t0) / d)));
  const b = CTA_BEATS.reduce((m, t0) => Math.max(m, beat(t0)), 0);
  const btnT = 0.6, pk = spring(lt - btnT, SP.pop);
  const press = 1 - 0.06 * CTA_BEATS.reduce((m, t0) => Math.max(m, beat(t0 + 0.2, 0.25)), 0);
  const cta = lt > btnT ? `<g transform="translate(540,1736) scale(${(lerp(0.6, 1, pk) * press).toFixed(3)})" opacity="${clamp((lt - btnT) / 0.1).toFixed(3)}">
      <rect x="-320" y="${f1(-50 + 10 * (1 - press) / 0.06)}" width="640" height="128" rx="64" fill="#0d6b40" opacity="0.4"/>
      <rect x="-320" y="-64" width="640" height="128" rx="64" fill="${C.green}"/>
      ${text('X에서 팔로우', 0, 22, { size: 64, weight: 900, fill: C.ink, ls: -0.03 })}
    </g>` : '';
  const reink = (t0) => (lt > t0 ? t0 : 0.3);
  return `${text('WEEKLY', 540, 290, { size: 168, weight: 900, family: 'Inter', fill: C.ink, ls: 0.01 })}
    ${text('WICK', 540, 450, { size: 168, weight: 900, family: 'Inter', fill: C.ink, ls: 0.01 })}
    ${stampAt(lt, lt > 4.5 ? 4.5 : 0.5, 'QUALIFIED', C.green, 260, 1395, 46, -10, 71)}
    ${stampAt(lt, lt > 4.75 ? 4.75 : 0.75, 'VANISHED', C.gray, 860, 1385, 46, 8, 72)}
    <g transform="translate(0,${f1(-70 * b)}) rotate(${f1(3 * Math.sin(lt * 2.4))},540,1450)">${wick(lt, 540, 1450, sc, { mood: 'excited', mouth: b > 0.2 || lt < 1.0 ? 'wide' : 'closed', flameSize: 1.05 + 0.25 * b + 0.06 * Math.sin(lt * 3.1) })}</g>
    ${text('@weeklywick', 540, 1566, { size: 108, weight: 900, family: 'Inter', fill: C.ink, ls: -0.01 })}
    ${text('매주 토요일, 이번 주 판정 발표', 540, 1646, { size: 56, weight: 800, fill: C.inkSoft })}
    ${cta}`;
}

function sceneGraded(lt) {
  const s1 = shake(lt - 0.0, 0.3, 10), s2 = shake(lt - 0.5, 0.3, 10);
  return `<g transform="translate(${f1(s1.x + s2.x)},${f1(s1.y + s2.y)})">${paper(0, 0, W, H)}${sceneGradedContent(lt)}</g>`;
}

// ---------- composition and transitions ----------
const ORDER = ['hook', 'brand', 'rule', 'week', 'graded', 'cta'];
const RENDER = { hook: sceneHook, brand: sceneBrand, rule: sceneRule, week: sceneWeek, graded: sceneGraded };
const PAPER = new Set(['rule', 'graded', 'cta']);

function frame(t) {
  t = clamp(t, 0, window.DURATION - 1e-6);
  let body = DEFS + background();
  let footerDark = false;
  const layers = [];
  for (let i = 0; i < ORDER.length; i++) {
    const k = ORDER[i], [a, b] = S[k];
    const next = ORDER[i + 1], [inType, T] = IN[k] || ['none', 0];
    const [outType, To] = next ? IN[next] : ['none', 0];
    if (t < a - T || t >= b) continue;
    const lt = t - a;
    // Entry progress e (0..1 over [a - T, a]) and exit progress xk (0..1 over [b - To, b]).
    const e = T ? clamp((t - (a - T)) / T) : 1, xk = To ? clamp((t - (b - To)) / To) : 0;
    if (PAPER.has(k) && e >= 0.5 && xk < 0.5) footerDark = true;

    if (k === 'cta') {
      // Paper to paper: the ink band lifts away, the graded copy slides out left, the CTA slides in.
      const g = ease(e);
      body += layers.map((l) => l.svg).join(''); layers.length = 0;
      body += paper(0, 0, W, H, { band: 170 * (1 - g) });
      // A horizontal push on the same sheet: both pages fully opaque, side by side, never overlapping.
      const px = W * ease(e);
      if (e < 1) body += `<g transform="translate(${f1(-px)},0)">${sceneGradedContent(t - S.graded[0])}</g>`;
      body += `<g transform="translate(${f1(W - px)},0)">${sceneCtaContent(lt)}</g>`;
      continue;
    }

    let tr = '', op = 1;
    // Entry.
    if (inType === 'push') { tr += `translate(0,${f1(H * (1 - ease(e)))}) `; }
    if (inType === 'cover') { tr += `translate(0,${f1(H * (1 - ease(e)))}) `; }
    if (inType === 'slide') { tr += `translate(${f1(W * (1 - ease(e)))},0) `; }
    if (inType === 'uncover') { const s = lerp(0.92, 1, easeOut(e)); op *= easeOut(e); tr += `translate(540,960) scale(${s.toFixed(4)}) translate(-540,-960) `; }
    // Exit.
    if (outType === 'push') { tr += `translate(0,${f1(-H * ease(xk))}) `; }
    if (outType === 'cross') { const s = lerp(1, 1.1, ease(xk)); op *= 1 - clamp(xk / 0.6); tr += `translate(540,700) scale(${s.toFixed(4)}) translate(-540,-700) `; }
    if (outType === 'cover') { const s = lerp(1, 0.92, ease(xk)); op *= 1 - clamp(xk / 0.55); tr += `translate(540,960) scale(${s.toFixed(4)}) translate(-540,-960) `; }
    if (outType === 'slide') { tr += `translate(${f1(-W * 0.35 * ease(xk))},0) `; op *= 1 - clamp(xk / 0.7); }
    if (outType === 'uncover') { tr += `translate(0,${f1(-H * ease(xk))}) `; }
    if (outType === 'expand' && xk > 0) continue; // the CTA branch draws the outgoing graded copy
    layers.push({ k, inType, svg: `<g transform="${tr}" opacity="${op.toFixed(3)}">${RENDER[k](lt)}</g>` });
  }
  // Uncover: the outgoing scene slides away on top of the incoming one.
  if (layers.length === 2 && layers[1].inType === 'uncover') layers.reverse();
  body += layers.map((l) => l.svg).join('');
  body += text('Not financial advice', 540, 1878, { size: 34, weight: 600, fill: footerDark ? C.inkMuted : '#8d96a8', ls: 0 });
  return body;
}

const root = document.getElementById('stage');
window.seek = async (t) => {
  await document.fonts.ready;
  root.innerHTML = frame(t);
};
window.ready = (async () => {
  await Promise.all([...document.fonts].map((f) => f.load().catch(() => {})));
  await document.fonts.ready;
  await window.seek(0);
  return true;
})();
</script>
</body>
</html>
