<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Weekly Wick 홍보 영상</title>
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url(fonts/Pretendard-Medium.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url(fonts/Pretendard-SemiBold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url(fonts/Pretendard-Bold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 900; src: url(fonts/Pretendard-Black.otf); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(fonts/Inter-ExtraBold.otf); }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url(fonts/Inter-Black.otf); }
  html, body { margin: 0; padding: 0; background: #10141f; overflow: hidden; }
  #stage { display: block; width: 1080px; height: 1920px; }
  /* Preload every weight so the first seek never renders a fallback face. */
  #preload { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<div id="preload">
  <span style="font:500 10px Pretendard">가</span><span style="font:600 10px Pretendard">가</span>
  <span style="font:700 10px Pretendard">가</span><span style="font:800 10px Pretendard">가</span>
  <span style="font:900 10px Pretendard">가</span><span style="font:800 10px Inter">A</span>
  <span style="font:900 10px Inter">A</span>
</div>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"></svg>
<script type="module">
import { drawWick, blinkAt } from './lib/rig.mjs';

// Weekly Wick promo, 9:16, 30 s. Every frame is a pure function of t (seconds).
const W = 1080, H = 1920;
window.DURATION = 30;

const C = {
  bg: '#10141f', bg2: '#182238', line: '#2a3142', text: '#eef1f7', muted: '#9aa3b5',
  paper: '#f3ede1', rule: '#ddd2bd', margin: '#e48a78', ink: '#1b1f2a', inkMuted: '#6b6457',
  green: '#22c47a', red: '#ef5350', gray: '#8a8174', amber: '#ffb020', flame: '#ff8a1f',
};

// Scene table (seconds). Kept in one place so audio cues and stills read from the same clock.
const S = {
  hook: [0, 5.0],
  brand: [5.0, 9.6],
  rule: [9.6, 16.2],
  week: [16.2, 21.9],
  graded: [21.9, 26.4],
  cta: [26.4, 30],
};
window.SCENES = S;

// ---------- motion ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => { k = clamp(k); return k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2; };
const easeOut = (k) => 1 - (1 - clamp(k)) ** 3;
const easeIn = (k) => clamp(k) ** 3;

// Damped mass-spring from 0 to 1, closed form. mass > 1 feels heavier and overshoots longer.
function spring(t, { mass = 1, stiffness = 180, damping = 14 } = {}) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
  if (z >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
}
const SP = {
  pop: { mass: 1, stiffness: 260, damping: 15 },      // text and chips
  soft: { mass: 1.4, stiffness: 140, damping: 20 },   // panels and paper
  heavy: { mass: 2.2, stiffness: 420, damping: 30 },  // stamps landing
  bouncy: { mass: 1.2, stiffness: 200, damping: 10 }, // character entrances
};

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// Decaying shake after an impact at local time 0.
function shake(t, dur = 0.32, amp = 10) {
  if (t < 0 || t > dur) return { x: 0, y: 0 };
  const k = (1 - t / dur) ** 2 * amp;
  return { x: Math.sin(t * 93) * k, y: Math.cos(t * 71) * k };
}

// Scene exit: content slides up and fades over the last `dur` seconds of the scene.
function exitK(t, end, dur = 0.32) { return easeIn((t - (end - dur)) / dur); }

// ---------- drawing helpers ----------
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const f1 = (v) => (Math.round(v * 10) / 10).toString();

function text(str, x, y, { size = 64, weight = 800, fill = C.text, anchor = 'middle', family = 'Pretendard', ls = -0.02, opacity = 1 } = {}) {
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${family}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${f1(size * ls)}" opacity="${opacity.toFixed(3)}">${esc(str)}</text>`;
}

// A line that springs up into place. Scale is applied around the line's own anchor.
function popLine(t, start, str, x, y, opts = {}) {
  const k = spring(t - start, opts.spring || SP.pop);
  if (t < start) return '';
  const s = lerp(0.72, 1, k), dy = (1 - k) * 46, op = clamp((t - start) / 0.12);
  return `<g transform="translate(${f1(x)},${f1(y + dy)}) scale(${s.toFixed(4)})">${text(str, 0, 0, { ...opts, opacity: op })}</g>`;
}

// Worn rubber stamp, same construction as the card renderer (lib/cards.mjs, style B).
function stamp(label, color, size, seed) {
  const w = label.length * size * 0.66 + size * 1.4, h = size * 1.9;
  const r = rng(seed);
  let specks = '';
  for (let i = 0; i < 80; i++) specks += `<circle cx="${f1((r() - 0.5) * w)}" cy="${f1((r() - 0.5) * h)}" r="${f1(0.8 + r() * 2.8)}" fill="#000"/>`;
  const id = `wear${seed}`;
  return `<mask id="${id}"><rect x="${-w}" y="${-h}" width="${w * 2}" height="${h * 2}" fill="#fff"/>${specks}</mask>
    <g mask="url(#${id})" fill-opacity="0.92" stroke-opacity="0.92">
      <rect x="${f1(-w / 2)}" y="${f1(-h / 2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(size * 0.25)}" fill="none" stroke="${color}" stroke-width="${f1(size * 0.12)}"/>
      <rect x="${f1(-w / 2 + size * 0.22)}" y="${f1(-h / 2 + size * 0.22)}" width="${f1(w - size * 0.44)}" height="${f1(h - size * 0.44)}" rx="${f1(size * 0.15)}" fill="none" stroke="${color}" stroke-width="${f1(size * 0.05)}"/>
      <text x="0" y="${f1(size * 0.36)}" font-family="Inter" font-size="${size}" font-weight="900" text-anchor="middle" letter-spacing="${f1(size * 0.04)}" fill="${color}">${esc(label)}</text>
    </g>`;
}

// Stamp that drops from above the paper and lands with a heavy spring.
function stampAt(t, start, label, color, x, y, size, rot, seed) {
  if (t < start) return '';
  const k = spring(t - start, SP.heavy);
  const s = lerp(2.1, 1, k), op = clamp((t - start) / 0.06);
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${rot}) scale(${s.toFixed(4)})" opacity="${op.toFixed(3)}">${stamp(label, color, size, seed)}</g>`;
}

// The character from the real rig, placed with its feet at (x, y) and a given scale.
function wick(t, x, y, scale, state) {
  const g = drawWick({ t, blink: blinkAt(t), up: true, ...state });
  return `<g transform="translate(${f1(x - 300 * scale)},${f1(y - 712 * scale)}) scale(${scale.toFixed(4)})">${g}</g>`;
}

function candle(cx, open, close, high, low, w, color) {
  const top = Math.min(open, close), bot = Math.max(open, close);
  return `<line x1="${f1(cx)}" y1="${f1(high)}" x2="${f1(cx)}" y2="${f1(low)}" stroke="${color}" stroke-width="${f1(Math.max(3, w * 0.12))}" stroke-linecap="round"/>
    <rect x="${f1(cx - w / 2)}" y="${f1(top)}" width="${f1(w)}" height="${f1(Math.max(4, bot - top))}" rx="${f1(w * 0.08)}" fill="${color}"/>`;
}

function background(t) {
  // Slow diagonal drift of faint ruled lines keeps the dark scenes from feeling static.
  const off = (t * 18) % 64;
  let lines = '';
  for (let y = -64; y < H + 64; y += 64) lines += `<line x1="0" y1="${f1(y + off)}" x2="${W}" y2="${f1(y + off)}" stroke="#ffffff" stroke-opacity="0.025" stroke-width="2"/>`;
  return `<defs><linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${C.bg}"/><stop offset="0.55" stop-color="${C.bg2}"/><stop offset="1" stop-color="${C.bg}"/>
    </linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bgG)"/>${lines}`;
}

function paper(x, y, w, h, { header = true } = {}) {
  let rules = '';
  for (let ry = y + (header ? 176 : 80); ry < y + h - 20; ry += 64) rules += `<line x1="${x}" y1="${ry}" x2="${x + w}" y2="${ry}" stroke="${C.rule}" stroke-width="2"/>`;
  return `<rect x="${x + 10}" y="${y + 18}" width="${w}" height="${h}" rx="28" fill="#000" opacity="0.35"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="28" fill="${C.paper}"/>
    <g clip-path="url(#paperClip)">${rules}
    <line x1="${x + 52}" y1="${y}" x2="${x + 52}" y2="${y + h}" stroke="${C.margin}" stroke-width="3"/>
    ${header ? `<rect x="${x}" y="${y}" width="${w}" height="112" fill="${C.ink}"/>
      ${text('WEEKLY WICK', x + w - 48, y + 72, { size: 40, weight: 900, family: 'Inter', fill: C.paper, anchor: 'end', ls: 0.18 })}` : ''}
    </g>
    <clipPath id="paperClip"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="28"/></clipPath>`;
}

// ---------- scenes ----------

// 1. Hook: a weekly candle shoots up mid-week, then the Friday close gives it all back.
//    What's left is a long upper wick, which is where the name comes from.
function sceneHook(t) {
  const [a, b] = S.hook;
  const lt = t - a, ex = exitK(t, b, 0.4);
  const days = ['월', '화', '수', '목', '금'];
  // Day cursor: Mon..Wed during the rise, Thu..Fri during the drop.
  const dayT = [0.25, 1.0, 1.75, 2.75, 3.5];
  let day = 0;
  dayT.forEach((d, i) => { if (lt >= d) day = i; });

  const open = 1330;
  // Each day moves the close with its own spring, so the candle builds visibly Mon..Fri.
  const steps = [[0.25, -170], [1.0, -230], [1.75, -300], [2.75, 300], [3.5, 470]];
  let close = open, high = open;
  steps.forEach(([st, d]) => {
    const k = spring(lt - st, { mass: 1.2, stiffness: 160, damping: 15 });
    close += d * k;
    if (d < 0) high += d * Math.min(1, k);
  });
  const isRed = close > open;
  const col = isRed ? C.red : C.green;
  const cx = 540, cw = 240;

  // Faint history candles behind the hero candle.
  const hist = [[120, 1390, 1300, 1260, 1420], [230, 1310, 1350, 1270, 1380], [340, 1350, 1270, 1240, 1370],
    [810, 1280, 1370, 1250, 1400], [905, 1360, 1290, 1270, 1390], [1000, 1290, 1340, 1260, 1370]];
  let bgC = '';
  hist.forEach(([x, o, c, hi, lo]) => { bgC += candle(x, o, c, hi, lo, 58, c < o ? C.green : C.red); });

  // Friday-close line sweeps in once the drop starts.
  const lineK = easeOut((lt - 3.3) / 0.5);
  const closeLine = lineK > 0 ? `<line x1="${f1(540 - 480 * lineK)}" y1="1400" x2="${f1(540 + 480 * lineK)}" y2="1400" stroke="${C.text}" stroke-width="4" stroke-dasharray="18 14" opacity="0.6"/>
    ${text('금요일 마감', 1020, 1460, { size: 38, weight: 700, fill: C.muted, anchor: 'end', opacity: lineK })}` : '';

  // Bracket that points at the leftover upper wick.
  const wickK = spring(lt - 3.75, SP.pop);
  const bracket = lt > 3.75 ? `<g opacity="${clamp((lt - 3.75) / 0.15).toFixed(3)}" transform="translate(${f1(lerp(30, 0, wickK))},0)">
      <path d="M ${cx + 160} ${f1(high)} h 30 v ${f1(open - 20 - high)} h -30" fill="none" stroke="${C.amber}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      ${text('이게', cx + 215, (high + open) / 2 - 10, { size: 60, weight: 900, fill: C.amber, anchor: 'start' })}
      ${text('윅(Wick)', cx + 215, (high + open) / 2 + 62, { size: 60, weight: 900, fill: C.amber, anchor: 'start' })}
    </g>` : '';

  let chips = '';
  days.forEach((d, i) => {
    const x = 540 + (i - 2) * 168, on = i === day && lt >= 0.25;
    const k = on ? spring(lt - dayT[i], SP.pop) : 0;
    const s = 1 + 0.12 * k * (1 - clamp((lt - dayT[i] - 0.4) / 0.3));
    chips += `<g transform="translate(${x},1680) scale(${s.toFixed(3)})">
      <rect x="-64" y="-56" width="128" height="112" rx="28" fill="${on ? (i >= 3 ? C.red : C.green) : '#1e2638'}"/>
      ${text(d, 0, 20, { size: 54, weight: 800, fill: on ? C.ink : C.muted })}</g>`;
  });

  const shk = shake(lt - 3.55, 0.4, 12);
  const line1 = lt < 2.7
    ? popLine(t, a + 0.15, '주중에 급등?', 540, 360, { size: 104, weight: 900 }) +
      popLine(t, a + 0.45, '아직 아무것도 아닙니다', 540, 470, { size: 60, weight: 700, fill: C.muted })
    : popLine(t, a + 2.75, '금요일에 밀리면', 540, 360, { size: 104, weight: 900 }) +
      popLine(t, a + 3.0, '꼬리만 남고 끝', 540, 470, { size: 60, weight: 700, fill: C.red });

  return `<g transform="translate(${f1(shk.x)},${f1(shk.y - 140 * ex)})" opacity="${(1 - ex).toFixed(3)}">
    <g opacity="0.22">${bgC}</g>
    ${closeLine}
    ${candle(cx, open, close, high, Math.max(open, close) + 40, cw, col)}
    ${bracket}
    ${line1}
    ${chips}
  </g>`;
}

// 2. Brand: the character springs up, flame catches, wordmark slams.
function sceneBrand(t) {
  const [a, b] = S.brand;
  const lt = t - a, ex = exitK(t, b);
  const enter = spring(lt - 0.05, SP.bouncy);
  const y = lerp(2250, 1400, enter);
  const flame = lerp(0.05, 1.15, spring(lt - 0.45, { mass: 1, stiffness: 120, damping: 7 }));
  const mood = lt < 0.5 ? 'calm' : 'excited';
  const mouth = lt > 0.5 && lt < 1.4 ? 'wide' : 'closed';

  const slam = (str, st, y) => {
    if (lt < st) return '';
    const k = spring(lt - st, SP.pop);
    return `<g transform="translate(540,${f1(y + (1 - k) * -80)}) scale(${lerp(1.7, 1, k).toFixed(3)})">${text(str, 0, 0, { size: 150, weight: 900, family: 'Inter', ls: 0.01, opacity: clamp((lt - st) / 0.08) })}</g>`;
  };
  const word = slam('WEEKLY', 0.7, 300) + slam('WICK', 0.95, 450);
  const shk = shake(lt - 1.0, 0.3, 10);

  return `<g transform="translate(${f1(shk.x)},${f1(shk.y - 140 * ex)})" opacity="${(1 - ex).toFixed(3)}">
    ${word}
    ${popLine(t, a + 1.3, 'Weekly close or it didn\'t happen.', 540, 545, { size: 44, weight: 800, family: 'Inter', fill: C.amber, ls: -0.01 })}
    ${wick(lt, 540, y, 1.05, { mood, mouth, flameSize: flame })}
    ${popLine(t, a + 1.9, '미국 주식을 매주 한 번,', 540, 1530, { size: 72, weight: 800 })}
    ${popLine(t, a + 2.15, '금요일 마감으로만 판정합니다', 540, 1625, { size: 60, weight: 700, fill: C.muted })}
  </g>`;
}

// Mini weekly chart for the rule sheet. `last` animates the final candle (0..1).
function miniChart(x, y, kind, k) {
  const bandY = y + 150;
  const bars = [[0, 210, 190, 170, 230], [1, 195, 215, 180, 235], [2, 215, 200, 185, 240], [3, 205, 185, 165, 225], [4, 190, 170, 150, 205]];
  let s = `<line x1="${x}" y1="${bandY}" x2="${x + 400}" y2="${bandY}" stroke="${C.ink}" stroke-width="3" stroke-dasharray="12 10" opacity="0.55"/>`;
  bars.forEach(([i, o, c, hi, lo]) => { s += candle(x + 30 + i * 62, y + o, y + c, y + hi, y + lo, 34, c < o ? '#46a877' : '#d0726b'); });
  const cx = x + 30 + 5 * 62 + 14, o = y + 175;
  if (kind === 'hold') {
    const c = lerp(o - 4, y + 90, k), hi = lerp(o - 4, y + 70, k);
    s += candle(cx, o, c, hi, o + 18, 48, C.green);
  } else {
    // Pops above the band mid-week, then closes back under it.
    const up = clamp(k / 0.55), dn = clamp((k - 0.55) / 0.45);
    const hi = lerp(o - 4, y + 55, ease(up));
    const c = lerp(lerp(o - 4, y + 70, ease(up)), y + 200, ease(dn));
    s += candle(cx, o, c, hi, Math.max(o, c) + 16, 48, c > o ? C.red : C.green);
  }
  return s;
}

// 3. The rule, on the brand's judges' sheet: hold the close = QUALIFIED, slip = VANISHED.
function sceneRule(t) {
  const [a, b] = S.rule;
  const lt = t - a, ex = exitK(t, b, 0.38);
  const enter = spring(lt, SP.soft);
  const py = lerp(1950, 210, enter) - 140 * ex;
  const px = 50, pw = 980, ph = 1420;

  const hitA = 2.05, hitB = 3.65;
  const shk = shake(lt - hitA, 0.3, 11), shk2 = shake(lt - hitB, 0.3, 11);
  const sx = shk.x + shk2.x, sy = shk.y + shk2.y;

  const kA = ease((lt - 0.9) / 1.0), kB = ease((lt - 2.3) / 1.25);
  let mood = 'calm', mouth = 'closed';
  if (lt > hitA && lt < hitB) { mood = 'excited'; mouth = lt < hitA + 0.7 ? 'wide' : 'closed'; }
  if (lt >= hitB && lt < hitB + 1.6) mood = 'gloomy';
  if (lt >= hitB + 1.6) mood = 'calm';

  const rowA = py + 300, rowB = py + 760;
  const chartAt = (x, y, kind, k) => `<g transform="translate(${x},${y}) scale(1.2)">${miniChart(0, 0, kind, k)}</g>`;
  const inner = `
    ${paper(px, py, pw, ph)}
    ${popLine(t, a + 0.35, '판정은 두 가지뿐', px + 100, py + 228, { size: 82, weight: 900, fill: C.ink, anchor: 'start' })}
    <g transform="translate(0,${f1(lerp(40, 0, spring(lt - 0.6, SP.pop)))})" opacity="${clamp((lt - 0.6) / 0.2).toFixed(3)}">
      ${text('마감까지 버티면', px + 100, rowA + 60, { size: 58, weight: 800, fill: C.ink, anchor: 'start' })}
      ${chartAt(px + 90, rowA + 40, 'hold', kA)}
    </g>
    ${stampAt(lt, hitA, 'QUALIFIED', C.green, px + 780, rowA + 270, 50, -8, 11)}
    <line x1="${px + 100}" y1="${rowA + 420}" x2="${px + pw - 60}" y2="${rowA + 420}" stroke="${C.ink}" stroke-opacity="0.18" stroke-width="3" opacity="${clamp((lt - 2.2) / 0.2).toFixed(3)}"/>
    <g transform="translate(0,${f1(lerp(40, 0, spring(lt - 2.25, SP.pop)))})" opacity="${clamp((lt - 2.25) / 0.2).toFixed(3)}">
      ${text('마감에 밀리면', px + 100, rowB + 60, { size: 58, weight: 800, fill: C.ink, anchor: 'start' })}
      ${chartAt(px + 90, rowB + 40, 'fade', kB)}
    </g>
    ${stampAt(lt, hitB, 'VANISHED', C.gray, px + 780, rowB + 270, 50, -6, 23)}
    ${popLine(t, a + 4.35, '중간에 튄 건 판정에 넣지 않습니다', px + 100, py + 1250, { size: 48, weight: 700, fill: C.inkMuted, anchor: 'start' })}
    ${wick(lt, px + pw - 140, py + ph - 10, 0.36, { mood, mouth, flameSize: mood === 'gloomy' ? 0.5 : 1 })}
  `;
  return `<g transform="translate(${f1(sx)},${f1(sy)})" opacity="${(1 - ex).toFixed(3)}">${inner}</g>`;
}

// 4. The week's rhythm, ending on Saturday's confirmed verdict.
function sceneWeek(t) {
  const [a, b] = S.week;
  const lt = t - a, ex = exitK(t, b);
  const rows = [
    ['월', '지난 판정 채점'],
    ['화', '무료 공개 종목 추적'],
    ['수', '신호가 사라지는 이유'],
    ['목', '후보 레이스와 투표'],
    ['금', '마감 직전 예고'],
    ['토', '이번 주 확정 발표'],
  ];
  let s = '';
  rows.forEach(([d, label], i) => {
    const st = 0.45 + i * 0.36, k = spring(lt - st, SP.pop);
    if (lt < st) return;
    const y = 500 + i * 162, last = i === rows.length - 1;
    const dx = (1 - k) * 260, op = clamp((lt - st) / 0.12);
    const chipFill = last ? C.green : '#222b40';
    s += `<g transform="translate(${f1(dx)},0)" opacity="${op.toFixed(3)}">
      ${last ? `<rect x="70" y="${y - 74}" width="940" height="148" rx="36" fill="#1b2a2a" stroke="${C.green}" stroke-width="3"/>` : ''}
      <rect x="110" y="${y - 50}" width="100" height="100" rx="26" fill="${chipFill}"/>
      ${text(d, 160, y + 18, { size: 50, weight: 800, fill: last ? C.ink : C.text })}
      ${text(label, 250, y + 20, { size: last ? 62 : 56, weight: last ? 900 : 700, fill: last ? C.text : '#d6dbe6', anchor: 'start' })}
    </g>`;
  });
  const satT = 0.45 + 5 * 0.36;
  const pillK = spring(lt - satT - 0.35, SP.pop);
  const pill = lt > satT + 0.35 ? `<g transform="translate(110,1490) scale(${lerp(0.6, 1, pillK).toFixed(3)})" opacity="${clamp((lt - satT - 0.35) / 0.1).toFixed(3)}">
      <rect x="0" y="0" width="520" height="80" rx="40" fill="${C.green}"/>
      ${text('CONFIRMED · Weekly close', 260, 52, { size: 34, weight: 800, family: 'Inter', fill: C.ink, ls: 0 })}
    </g>` : '';
  const wy = lerp(2300, 1790, spring(lt - satT - 0.2, SP.bouncy));
  return `<g transform="translate(0,${f1(-140 * ex)})" opacity="${(1 - ex).toFixed(3)}">
    ${popLine(t, a + 0.1, '일주일 내내, 규칙대로', 540, 330, { size: 88, weight: 900 })}
    ${s}
    ${pill}
    ${lt > satT ? wick(lt, 860, wy, 0.5, { mood: 'excited', flameSize: 1.1 }) : ''}
  </g>`;
}

// 5. Accountability: every call is graded against SPY, misses included.
function sceneGraded(t) {
  const [a, b] = S.graded;
  const lt = t - a, ex = exitK(t, b, 0.38);
  const enter = spring(lt, SP.soft);
  const py = lerp(1950, 230, enter) - 140 * ex;
  const px = 50, pw = 980, ph = 1330;
  const hitA = 1.05, hitB = 1.85;
  const s1 = shake(lt - hitA, 0.3, 10), s2 = shake(lt - hitB, 0.3, 10);
  let mood = 'calm';
  if (lt > hitA && lt < hitB) mood = 'excited';
  if (lt >= hitB && lt < hitB + 1.3) mood = 'apology';
  const inner = `
    ${paper(px, py, pw, ph)}
    ${popLine(t, a + 0.3, '틀린 판정도', px + 100, py + 240, { size: 92, weight: 900, fill: C.ink, anchor: 'start' })}
    ${popLine(t, a + 0.5, '전부 공개합니다', px + 100, py + 350, { size: 92, weight: 900, fill: C.ink, anchor: 'start' })}
    ${popLine(t, a + hitA - 0.25, 'SPY보다 잘했으면', px + 100, py + 500, { size: 50, weight: 700, fill: C.inkMuted, anchor: 'start' })}
    ${stampAt(lt, hitA, 'BEAT SPY', C.green, px + 340, py + 615, 66, -6, 31)}
    ${popLine(t, a + hitB - 0.25, 'SPY보다 못했어도', px + 100, py + 780, { size: 50, weight: 700, fill: C.inkMuted, anchor: 'start' })}
    ${stampAt(lt, hitB, 'TRAILED SPY', C.red, px + 420, py + 895, 66, -4, 47)}
    ${popLine(t, a + 2.6, '모든 판정은 SPY와 비교해 채점', px + 100, py + 1090, { size: 52, weight: 800, fill: C.ink, anchor: 'start' })}
    ${popLine(t, a + 2.8, '매주 월요일, 결과 그대로', px + 100, py + 1165, { size: 44, weight: 700, fill: C.inkMuted, anchor: 'start' })}
    ${wick(lt, px + pw - 140, py + ph - 20, 0.36, { mood, flameSize: mood === 'apology' ? 0.5 : 1 })}
  `;
  return `<g transform="translate(${f1(s1.x + s2.x)},${f1(s1.y + s2.y)})" opacity="${(1 - ex).toFixed(3)}">${inner}</g>`;
}

// 6. CTA.
function sceneCta(t) {
  const [a] = S.cta;
  const lt = t - a;
  const enter = spring(lt - 0.05, SP.bouncy);
  const y = lerp(2300, 1250, enter);
  const flame = lerp(0.6, 1.3, spring(lt - 0.3, { mass: 1, stiffness: 120, damping: 8 }));
  const mouth = lt > 0.35 && lt < 1.1 ? 'wide' : 'closed';
  const pillK = spring(lt - 1.25, SP.pop);
  const pill = lt > 1.25 ? `<g transform="translate(540,1720) scale(${lerp(0.6, 1, pillK).toFixed(3)})" opacity="${clamp((lt - 1.25) / 0.1).toFixed(3)}">
      <rect x="-230" y="-52" width="460" height="104" rx="52" fill="${C.text}"/>
      ${text('X에서 팔로우', 0, 20, { size: 50, weight: 800, fill: C.ink })}
    </g>` : '';
  return `
    ${popLine(t, a + 0.15, 'WEEKLY WICK', 540, 340, { size: 120, weight: 900, family: 'Inter', ls: 0.02 })}
    ${popLine(t, a + 0.35, 'Weekly close or it didn\'t happen.', 540, 425, { size: 42, weight: 800, family: 'Inter', fill: C.amber, ls: -0.01 })}
    ${wick(lt, 540, y, 1.0, { mood: 'excited', mouth, flameSize: flame })}
    ${popLine(t, a + 0.7, '@weeklywick', 540, 1440, { size: 110, weight: 900, family: 'Inter', ls: -0.02 })}
    ${popLine(t, a + 0.95, '매주 토요일, 이번 주 판정 발표', 540, 1550, { size: 56, weight: 700, fill: C.muted })}
    ${pill}
  `;
}

function frame(t) {
  t = clamp(t, 0, window.DURATION - 1e-6);
  let body = background(t);
  const inS = (k) => t >= S[k][0] && t < S[k][1];
  if (inS('hook')) body += sceneHook(t);
  if (inS('brand')) body += sceneBrand(t);
  if (inS('rule')) body += sceneRule(t);
  if (inS('week')) body += sceneWeek(t);
  if (inS('graded')) body += sceneGraded(t);
  if (inS('cta')) body += sceneCta(t);
  body += text('Not financial advice', 540, 1870, { size: 30, weight: 600, family: 'Pretendard', fill: '#7f889b', ls: 0 });
  return body;
}

const root = document.getElementById('stage');
window.seek = async (t) => {
  await document.fonts.ready;
  root.innerHTML = frame(t);
};
window.ready = (async () => {
  await Promise.all([...document.fonts].map((f) => f.load().catch(() => {})));
  await document.fonts.ready;
  await window.seek(0);
  return true;
})();
</script>
</body>
